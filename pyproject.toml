[project]
name = "autoflow"
version = "0.1.0"
description = "A pluggable content-automation pipeline: pull from sources, transform with LLMs, push to sinks — on a schedule."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishabh Verma" }]
dependencies = [
    "defusedxml>=0.7", # hardened XML parsing for untrusted feeds
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.13",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
autoflow = "autoflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
